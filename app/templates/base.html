<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Defensive Pentest Scanner{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: #ffffff; --panel: #ffffff; --gray: #f1f2f4; --border: #e3e5e9; --text: #1e293b; --muted: #6b7280;
            --accent: #2f6fb3; --accent-dark: #235792;
            --ok: #2f9e5c; --warn: #c4901f; --bad: #d1453f;
            --critical: #b3261e; --high: #dc4a38; --medium: #d97f1f; --low: #b58a1f; --info: #64748b;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; min-height: 100vh; }
        .sidebar { width: 220px; flex-shrink: 0; background: var(--gray); border-right: 1px solid var(--border); padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .sidebar a.brand { display: block; color: var(--accent-dark); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; font-size: 15px; line-height: 1.3; margin-bottom: 28px; padding: 0 8px; }
        .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
        .sidebar nav a { color: var(--muted); text-decoration: none; padding: 9px 12px; border-radius: 7px; font-size: 14px; font-weight: 500; transition: background .15s ease, color .15s ease; }
        .sidebar nav a:hover { background: var(--panel); color: var(--accent); }
        .sidebar nav a.active { background: var(--accent); color: white; }
        main { flex: 1; min-width: 0; padding: 32px 40px 60px; max-width: 980px; }
        h1 { font-size: 22px; margin-bottom: 4px; color: var(--text); }
        h2 { font-size: 17px; margin-top: 28px; }
        .muted { color: var(--muted); font-size: 13px; }
        .banner { background: var(--gray); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .banner.warn { border-left-color: var(--warn); }
        .banner.bad { border-left-color: var(--bad); }
        .banner.ok { border-left-color: var(--ok); }
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(30, 41, 59, 0.04); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
        a.btn, button.btn { display: inline-block; background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 7px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .15s ease; }
        a.btn:hover, button.btn:hover { background: var(--accent-dark); }
        a.btn.secondary, button.btn.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
        a.btn.secondary:hover, button.btn.secondary:hover { background: var(--gray); }
        a.btn.danger, button.btn.danger { background: var(--bad); }
        a.btn.danger:hover, button.btn.danger:hover { background: #b53a35; }
        input, select, textarea { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 7px; font-size: 14px; width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47, 111, 179, 0.15); }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--muted); }
        .field { margin-bottom: 14px; }
        .row { display: flex; gap: 16px; }
        .row > * { flex: 1; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: white; }
        .badge.critical { background: var(--critical); }
        .badge.high { background: var(--high); }
        .badge.medium { background: var(--medium); }
        .badge.low { background: var(--low); color: #2b2107; }
        .badge.info { background: var(--info); }
        .badge.verified, .badge.completed, .badge.active { background: var(--ok); }
        .badge.pending, .badge.running { background: var(--warn); color: #2b2107; }
        .badge.failed, .badge.expired, .badge.revoked { background: var(--bad); }
        .badge.cancelled { background: var(--info); }
        .checkbox-row { display: flex; align-items: center; gap: 8px; }
        .checkbox-row input { width: auto; }
        code { background: var(--gray); color: var(--text); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        pre { background: var(--gray); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
<div class="sidebar">
    <a class="brand" href="/">Defensive Pentest Scanner</a>
    <nav>
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
        <a href="/targets" class="{{ 'active' if request.url.path.startswith('/targets') else '' }}">Targets</a>
        <a href="/audit" class="{{ 'active' if request.url.path.startswith('/audit') else '' }}">Audit Log</a>
    </nav>
</div>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
