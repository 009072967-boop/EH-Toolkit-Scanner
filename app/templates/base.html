<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Defensive Pentest Scanner{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
{% set path = request.url.path %}
<aside class="sidebar">
    <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <span class="brand-text"><strong>Defensive Pentest</strong><span>Scanner</span></span>
    </a>

    <div class="nav-label">Workspace</div>
    <nav>
        <a href="/" class="{{ 'active' if path == '/' else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            Dashboard
        </a>
        <a href="/targets" class="{{ 'active' if path.startswith('/targets') or path.startswith('/scans') else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
            Targets
        </a>
        <a href="/audit" class="{{ 'active' if path.startswith('/audit') else '' }}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
            Audit Log
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="status-line"><span class="badge yes" style="padding:2px 7px">enforced</span> Allow-list</div>
        Scans only run against verified, authorized targets.
    </div>
</aside>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
